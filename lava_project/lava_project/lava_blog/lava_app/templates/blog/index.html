{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Blog</title>
    <style>
        h2 {
            text-align: center;
            font-family: 'Arial, sans-serif';
            color:rgb(195, 207, 33);
        }
        .posts-container {
            width: 80%;
            margin: 20px auto;
            font-family: 'Arial, sans-serif';
            color:rgb(253, 253, 252);
            line-height: 1.6;
        }
        .post {
            border-bottom: 1px solid #074076;
            padding: 15px 0;
            position: relative;
        }

        .post h3 {
            color:rgb(195, 207, 33);
            margin: 0;
            font-size: 1.5rem;
        }

        .post small {
            color: #888;
            font-size: 0.9rem;
        }

        .post-content {
            margin-top: 10px;
            max-height: 60px;
            overflow: hidden;
            transition: max-height 0.4s ease, background-color 0.4s ease;
           
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .post-content:hover {
            max-height: 500px; 
        }
        body {
        background-image: url("{% static 'space.webp' %}");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;

    }
    </style>
</head>
<body>
    <div>
        <h2>Space Blog</h2>
    </div>
    <div class="posts-container">
        {% for post in posts %}
            <div class="post">
                <h3>{{ post.title }}</h3>
                <small>{{ post.created_on.date }}</small>
                <p class="post-content">
                    {{ post.body }}
                </p>
            </div>
        {% endfor %}
    </div>
</body>
</html>
